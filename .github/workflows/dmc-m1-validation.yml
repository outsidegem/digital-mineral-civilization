name: DMC M1 Constitutional Core Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmc-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: M1 Build, Tests and Policy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check dmc-types formatting
        run: cargo fmt --manifest-path core/dmc-types/Cargo.toml -- --check

      - name: Check titan-identity formatting
        run: cargo fmt --manifest-path core/titan-identity/Cargo.toml -- --check

      - name: Check titan-policy-core formatting
        run: cargo fmt --manifest-path core/titan-policy-core/Cargo.toml -- --check

      - name: Check titan-audit formatting
        run: cargo fmt --manifest-path core/titan-audit/Cargo.toml -- --check

      - name: Run Clippy on M1 core crates
        run: cargo clippy --locked --package dmc-types --package titan-identity --package titan-policy-core --package titan-audit --all-targets -- -D warnings

      - name: Test M1 core crates
        run: cargo test --locked --package dmc-types --package titan-identity --package titan-policy-core --package titan-audit

      - name: Verify E2 sandbox authorization
        run: cargo test --locked -p titan-policy-core e2_can_create_sandbox_report

      - name: Verify treasury transfer denial
        run: cargo test --locked -p titan-policy-core e2_cannot_transfer_treasury_funds

      - name: Verify missing identity denial
        run: cargo test --locked -p titan-policy-core missing_identity_fails_closed

      - name: Verify reserved authority denial
        run: cargo test --locked -p titan-policy-core e5_reserved_authority_fails_closed

      - name: Verify unknown action denial
        run: cargo test --locked -p titan-policy-core unknown_action_fails_closed

      - name: Build M1 core documentation
        run: cargo doc --locked --package dmc-types --package titan-identity --package titan-policy-core --package titan-audit --no-deps
