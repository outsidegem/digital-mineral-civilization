name: DMC Simulation Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Run DMC Foundation & Security Scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build simulation executable
        run: cargo build --locked -p dmc-simulator

      - name: Run Foundation Scenario
        run: cargo run --locked -p dmc-simulator -- run foundation

      - name: Run All Acceptance & Security Regression Scenarios
        run: cargo run --locked -p dmc-simulator -- run all

      - name: Run Workspace Tests
        run: cargo test --locked --workspace

      - name: Archive Simulation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmc-simulation-reports
          path: output/*.json
          if-no-files-found: error
